version: 2

gitlab_urls:
  api: https://sbp.gitlab.schubergphilis.com/api/v4/
  download: https://sbp.gitlab.schubergphilis.com
  # Authenticate with CI_JOB_TOKEN; artifacts go to the generic package registry.
  use_job_token: true
  use_package_registry: true

before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/vault-plugin-secrets-datadog/main.go
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X sbp.gitlab.schubergphilis.com/SaaS/Azure/vault/vault-plugins/vault-plugin-secrets-datadog/plugin.Version=v{{ .Version }}"
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm
        goarm: "6"
archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ["zip"]
checksum:
  name_template: "vault-plugin-secrets-datadog_{{ .Version }}.checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  # CHANGELOG.md is maintained by hand; the GitLab changelog API is not
  # available with CI_JOB_TOKEN anyway.
  disable: true

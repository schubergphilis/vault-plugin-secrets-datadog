version: 2

before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/vault-plugin-secrets-datadog/main.go
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X github.com/schubergphilis/vault-plugin-secrets-datadog/plugin.Version=v{{ .Version }}"
    # Every target compiles the large datadogV2 package (~5 GB peak memory),
    # so extra targets are costly.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
checksum:
  name_template: "vault-plugin-secrets-datadog_{{ .Version }}.checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  # CHANGELOG.md is maintained by hand.
  disable: true
